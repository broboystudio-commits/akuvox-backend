# Deploy on Render (render.com).
# This file must sit at the top level of the repository for Render to find it.
# In Render: New -> Blueprint -> pick this repo -> pick the branch.
services:
  - type: web
    name: breslov-daily
    runtime: node
    plan: free
    rootDir: breslov
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
