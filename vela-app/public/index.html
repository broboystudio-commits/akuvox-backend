<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070B">
  <meta name="description" content="Vela: vertical video with an algorithm you can see and steer.">
  <title>Vela</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="vela-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#14B8A6"></stop>
        <stop offset="1" stop-color="#8B5CF6"></stop>
      </linearGradient>
    </defs>
  </svg>

  <div id="app" class="app">
    <main id="screen" class="screen" tabindex="-1"></main>
    <nav id="tabbar" class="tabbar" aria-label="Main" hidden></nav>
    <div id="sheet-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <input id="file-input" class="sr-only" type="file" accept="video/mp4,video/webm,video/quicktime" tabindex="-1" aria-hidden="true">

  <noscript>Vela needs JavaScript turned on.</noscript>
  <script src="/app.js" type="module"></script>
</body>
</html>
