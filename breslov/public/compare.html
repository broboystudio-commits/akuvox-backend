<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Compare designs · Breslov Daily</title>
<meta name="robots" content="noindex" />
<style>
  :root {
    --bg: #ece9e6; --panel: #ffffff; --text: #1d1a1f; --text-2: #5d5663;
    --hair: rgba(32, 26, 30, 0.12); --accent: #7d4a52; --accent-bg: #f6ecea;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0d10; --panel: #1b1a1e; --text: #f2eef3; --text-2: #b3abb6;
      --hair: rgba(255, 252, 255, 0.14); --accent: #e0aeb5; --accent-bg: #2a2126;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e0d10; --panel: #1b1a1e; --text: #f2eef3; --text-2: #b3abb6;
    --hair: rgba(255, 252, 255, 0.14); --accent: #e0aeb5; --accent-bg: #2a2126;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    flex: 0 0 auto;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--hair);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 14px;
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  label.ctl { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 13px; }
  select, button {
    font: inherit; font-size: 14px; color: var(--text);
    background: var(--bg); border: 1px solid var(--hair); border-radius: 9px;
    min-height: 34px; padding: 4px 10px;
  }
  button { cursor: pointer; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .seg { display: inline-flex; padding: 2px; border-radius: 10px; background: var(--bg); border: 1px solid var(--hair); }
  .seg button { border: 0; background: none; min-height: 30px; border-radius: 8px; color: var(--text-2); }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.12); }

  .stage {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 28px;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    overflow: auto;
  }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  figcaption { font-size: 13px; color: var(--text-2); }
  figcaption strong { color: var(--text); font-weight: 600; }
  .phone {
    width: var(--w, 390px);
    height: var(--h, 844px);
    border-radius: 34px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 0 0 1px var(--hair), 0 18px 50px rgba(20, 12, 18, 0.18);
    position: relative;
  }
  .phone iframe {
    position: absolute; left: 0; top: 0;
    width: 390px; height: 844px;
    border: 0;
    transform-origin: 0 0;
    transform: scale(var(--s, 1));
    background: #fff;
  }

  /* Flip: one design at a time, full size, the other kept loaded behind it
     so switching is instant -- the only honest way to compare on a phone. */
  body.is-flip .stage { padding: 0; gap: 0; overflow: hidden; }
  body.is-flip figure { display: none; width: 100%; height: 100%; }
  body.is-flip figure.is-shown { display: flex; }
  body.is-flip figcaption { display: none; }
  body.is-flip .phone { width: 100%; height: 100%; border-radius: 0; box-shadow: none; }
  body.is-flip .phone iframe { width: 100%; height: 100%; transform: none; }
  body:not(.is-flip) .flip-only { display: none; }
</style>
</head>
<body>
<header>
  <h1>Previous vs Apple design</h1>
  <div class="controls">
    <label class="ctl">Page
      <select id="page">
        <option value="today">Today</option>
        <option value="read">Read</option>
        <option value="tehillim">Tehillim</option>
        <option value="tikkun">Tikkun HaKlali</option>
        <option value="torah">Quick Torah</option>
        <option value="week">This week</option>
        <option value="shabbos">Shabbos</option>
        <option value="zmanim">Zmanim</option>
        <option value="more">More</option>
        <option value="settings">Settings</option>
        <option value="about">About</option>
        <option value="privacy">Privacy</option>
        <option value="search">Search</option>
      </select>
    </label>
    <label class="ctl"><input type="checkbox" id="link" checked /> Keep both on the same page</label>
    <div class="seg" role="group" aria-label="Theme">
      <button type="button" data-theme-set="light">Light</button>
      <button type="button" data-theme-set="dark">Dark</button>
    </div>
    <div class="seg" role="group" aria-label="Layout">
      <button type="button" data-layout="side">Side by side</button>
      <button type="button" data-layout="flip">Flip</button>
    </div>
    <div class="seg flip-only" role="group" aria-label="Which design">
      <button type="button" data-show="current">Previous</button>
      <button type="button" data-show="apple">Apple</button>
    </div>
  </div>
</header>

<div class="stage" id="stage">
  <figure data-design="current">
    <div class="phone"><iframe name="bd-design:current" title="Previous design" src="/?design=current"></iframe></div>
    <figcaption><strong>Previous</strong> · the build 72 design</figcaption>
  </figure>
  <figure data-design="apple">
    <div class="phone"><iframe name="bd-design:apple" title="Apple design" src="/?design=apple"></iframe></div>
    <figcaption><strong>Apple design</strong> · what everyone sees now</figcaption>
  </figure>
</div>

<script>
(function () {
  var frames = {
    current: document.querySelector('iframe[name="bd-design:current"]'),
    apple: document.querySelector('iframe[name="bd-design:apple"]'),
  };
  var pageSel = document.getElementById('page');
  var link = document.getElementById('link');
  var showing = 'apple';

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  // ---- go to a page in one frame or both, without reloading either
  function goto(frame, name) {
    try { frame.contentWindow.postMessage({ bd: 'goto', name: name }, location.origin); } catch (e) {}
  }
  pageSel.addEventListener('change', function () {
    goto(frames.current, pageSel.value);
    goto(frames.apple, pageSel.value);
  });
  // A frame moved by itself (a tap inside it): bring the other one along.
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin || !e.data || e.data.bd !== 'panel') return;
    var from = e.data.frame === 'bd-design:apple' ? 'apple' : 'current';
    if (pageSel.querySelector('option[value="' + e.data.name + '"]')) pageSel.value = e.data.name;
    if (link.checked) goto(from === 'apple' ? frames.current : frames.apple, e.data.name);
  });

  // ---- theme: the app keeps it in localStorage, which both frames share,
  // so set it once and reload both.
  function setTheme(t) {
    store('bd.theme', JSON.stringify(t));
    document.documentElement.setAttribute('data-theme', t);
    var page = pageSel.value === 'today' ? '/' : '/' + pageSel.value;
    frames.current.src = page + '?design=current';
    frames.apple.src = page + '?design=apple';
    markTheme(t);
  }
  function markTheme(t) {
    document.querySelectorAll('[data-theme-set]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-theme-set') === t));
    });
  }
  document.querySelectorAll('[data-theme-set]').forEach(function (b) {
    b.addEventListener('click', function () { setTheme(b.getAttribute('data-theme-set')); });
  });
  var saved = read('bd.theme');
  var theme = saved === '"dark"' ? 'dark' : saved === '"light"' ? 'light'
    : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
  markTheme(theme);

  // ---- layout
  function fit() {
    if (document.body.classList.contains('is-flip')) return;
    var stage = document.getElementById('stage');
    var room = (stage.clientWidth - 32 - 28) / 2;
    var tall = stage.clientHeight - 36 - 30;
    var s = Math.min(1, room / 390, tall / 844);
    document.querySelectorAll('.phone').forEach(function (p) {
      p.style.setProperty('--s', s.toFixed(4));
      p.style.setProperty('--w', Math.round(390 * s) + 'px');
      p.style.setProperty('--h', Math.round(844 * s) + 'px');
    });
  }
  function setLayout(l) {
    document.body.classList.toggle('is-flip', l === 'flip');
    document.querySelectorAll('[data-layout]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-layout') === l));
    });
    show(showing);
    fit();
  }
  function show(which) {
    showing = which;
    document.querySelectorAll('figure').forEach(function (f) {
      f.classList.toggle('is-shown', f.getAttribute('data-design') === which);
    });
    document.querySelectorAll('[data-show]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-show') === which));
    });
  }
  document.querySelectorAll('[data-layout]').forEach(function (b) {
    b.addEventListener('click', function () { setLayout(b.getAttribute('data-layout')); });
  });
  document.querySelectorAll('[data-show]').forEach(function (b) {
    b.addEventListener('click', function () { show(b.getAttribute('data-show')); });
  });
  window.addEventListener('resize', fit);
  // A phone cannot show two phones at a readable size: start it on Flip.
  setLayout(window.innerWidth < 760 ? 'flip' : 'side');
})();
</script>
</body>
</html>
